<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <title>Manga HQ Acervo Raro</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #f4f5fb; background: #10131d; }
    header, main { width: min(1180px, calc(100% - 32px)); margin: auto; }
    header { padding: 38px 0 24px; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); }
    .intro { max-width: 720px; color: #aeb9ce; line-height: 1.6; }
    .hub { display: inline-block; padding: 11px 16px; margin-top: 7px; border-radius: 10px; background: #e13450; color: #fff; text-decoration: none; font-weight: 700; }
    #status { color: #aeb9ce; min-height: 1.5em; }
    section { margin: 34px 0 46px; }
    h2 { font-size: clamp(20px, 3vw, 27px); margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 18px; }
    .card { min-width: 0; overflow: hidden; background: #1b2130; border: 1px solid #313b51; border-radius: 12px; text-decoration: none; color: inherit; transition: transform .18s, border-color .18s; }
    .card:hover, .card:focus-visible { transform: translateY(-4px); border-color: #e13450; outline: none; }
    .cover { aspect-ratio: 2 / 3; background: #262c3b; display: grid; place-items: center; }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .cover-placeholder { width: 100%; height: 100%; display: grid; place-items: center; padding: 16px; text-align: center; color: #d7dceb; font-weight: 800; letter-spacing: .08em; background: linear-gradient(145deg, #242c3d, #151a27); }
    .details { display: block; padding: 12px; }
    .details strong { display: block; line-height: 1.3; font-size: 14px; }
    .details small { display: block; color: #aeb9ce; margin-top: 7px; }
    @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; } .details { padding: 9px; } }
  </style>
</head>
<body>
  <header>
    <h1>Manga HQ Acervo Raro</h1>
    <p class="intro">Histórias em suas próprias pastas, com cada edição em ordem. Você pode abrir os PDFs aqui ou encontrar estas HQs no leitor Manga HQ Hub.</p>
    <a class="hub" href="https://jogoiarexx-blip.github.io/Manga-HQ-hub/">Abrir Manga HQ Hub</a>
  </header>
  <main>
    <p id="status" role="status">Carregando acervo…</p>
    <div id="collections"></div>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const host = document.getElementById('collections');
      try {
        const response = await fetch('./catalogo.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const catalog = await response.json();
        status.textContent = `${catalog.itemCount} edições em ${catalog.collections.length} histórias`;
        for (const collection of catalog.collections) {
          const section = document.createElement('section');
          const heading = document.createElement('h2');
          heading.textContent = collection.title;
          const grid = document.createElement('div');
          grid.className = 'grid';
          for (const issue of collection.issues) {
            const card = document.createElement('a');
            card.className = 'card';
            card.href = issue.file;
            card.target = '_blank';
            card.rel = 'noopener';
            card.setAttribute('aria-label', `Abrir ${issue.title} em PDF`);
            const cover = document.createElement('div');
            cover.className = 'cover';
            if (issue.cover) {
              const image = document.createElement('img');
              image.src = issue.cover;
              image.alt = '';
              image.loading = 'lazy';
              image.addEventListener('error', () => {
                const fallback = document.createElement('span');
                fallback.className = 'cover-placeholder';
                fallback.textContent = 'PDF';
                image.replaceWith(fallback);
              }, { once: true });
              cover.append(image);
            } else {
              const fallback = document.createElement('span');
              fallback.className = 'cover-placeholder';
              fallback.textContent = 'PDF';
              cover.append(fallback);
            }
            const details = document.createElement('span');
            details.className = 'details';
            const title = document.createElement('strong');
            title.textContent = issue.title;
            const meta = document.createElement('small');
            meta.textContent = `${issue.pageCount} páginas · Abrir PDF ↗`;
            details.append(title, meta);
            card.append(cover, details);
            grid.append(card);
          }
          section.append(heading, grid);
          host.append(section);
        }
      } catch (error) {
        status.textContent = `Não foi possível carregar o acervo: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
